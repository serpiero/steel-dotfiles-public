# Obsidian: cybrdots-inspired spacing, isolated from existing Kitty settings.
font_family GeistMono Nerd Font
font_size 11
window_padding_width 12
background #161a1f
foreground #b8d5df
background_opacity 0.76
cursor #79bacd
selection_background #374453
selection_foreground #d6dbe0
active_tab_background #374453
active_tab_foreground #d6dbe0
inactive_tab_background #1b2127
inactive_tab_foreground #9aa5b1
tab_bar_edge bottom
tab_bar_style powerline
color0 #1b2127
color1 #aa7c85
color2 #829c91
color3 #a79d87
color4 #699cb7
color5 #8c90ab
color6 #79bacd
color7 #b8d5df
color8 #343b44
color9 #bd9299
color10 #9aafa4
color11 #b9ae98
color12 #8dc4df
color13 #b1b4c8
color14 #a0d5df
color15 #d8eef1

confirm_os_window_close 0
remember_window_size no
initial_window_width 100c
initial_window_height 30c

dynamic_background_opacity yes

# cybr-kitty geometry, with graphite/wine colors and no window borders.
modify_font cell_height 100%
tab_bar_align left
tab_bar_min_tabs 2
tab_powerline_style slanted
tab_bar_margin_width 0
tab_bar_margin_height 0 0
active_tab_font_style bold-italic
inactive_tab_font_style normal
window_border_width 0
cursor_trail 1
cursor_trail_decay 0.1 0.2
url_color #9aacc1
